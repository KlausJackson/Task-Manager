---
name: Prettier Check ExpressJS
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (expressjs)
        working-directory: expressjs
        run: npm ci || npm install
      - name: Run Prettier check (expressjs)
        working-directory: expressjs
        run: npx prettier --check .
